name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: node scripts/generate-icons.cjs

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test -- --reporter=verbose

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        if: matrix.node-version == 20

      - name: Build extension
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: localapply-dist-node${{ matrix.node-version }}
          path: dist/
          retention-days: 7
        if: matrix.node-version == 20

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  release:
    name: Package Release
    runs-on: ubuntu-latest
    needs: [build-and-test, lint]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: node scripts/generate-icons.cjs
      - run: npm run build

      - name: Zip extension
        run: |
          cd dist
          zip -r ../localapply-extension.zip .

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: localapply-extension.zip
          name: LocalApply v${{ steps.version.outputs.version }}
          body: |
            ## LocalApply v${{ steps.version.outputs.version }}

            ### Installation
            1. Download `localapply-extension.zip`
            2. Extract the zip
            3. Go to `chrome://extensions`
            4. Enable Developer Mode
            5. Click "Load unpacked" and select the extracted folder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
